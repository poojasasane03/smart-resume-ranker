<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Smart Resume Ranker</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo">Smart<span>Resume</span>Ranker</a>
      <h1 style="margin-top: 18px">Create your recruiter account</h1>
      <p class="auth-sub">Start ranking resumes in minutes.</p>

      <div id="form-message" class="form-message"></div>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" placeholder="Priya Sharma" />
        </div>

        <div class="form-group">
          <label for="company">Company name</label>
          <input type="text" id="company" placeholder="Acme Technologies" />
        </div>

        <div class="form-group">
          <label for="email">Work email</label>
          <input type="email" id="email" placeholder="priya@company.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" />
          <div class="form-hint">
            At least 8 characters, with a letter and a number.
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" />
        </div>
        <div class="form-group">
          <label for="invite-code">Invite code</label>
          <input type="text" id="invite-code" autocomplete="off" />
          <div class="form-hint">
            Needed on the online demo. Leave it empty on your own computer.
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          Create account
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/signup.js"></script>
  </body>
</html>
