<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Smart Resume Ranker</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="logo">Smart<span>Resume</span>Ranker</a>
      <h1 style="margin-top: 18px">Welcome back</h1>
      <p class="auth-sub">Log in to your recruiter account.</p>

      <div id="form-message" class="form-message"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="priya@company.com" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          Log in
        </button>
      </form>

      <p class="auth-footer">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
